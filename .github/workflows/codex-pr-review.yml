name: Codex PR Review

on:
  pull_request:
    branches:
      - dev
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    name: Codex PR Review
    if: github.event.pull_request.draft == false && vars.PR_REVIEWER == 'codex'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      review: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Prefetch base and head SHAs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          git remote set-url origin "https://github.com/${{ github.repository }}.git"

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-sol
          effort: high
          sandbox: read-only
          output-schema: |
            {
              "type": "object",
              "properties": {
                "summary": {
                  "type": "string",
                  "description": "Concise top-level review summary."
                },
                "no_blocking_issues": {
                  "type": "boolean",
                  "description": "True when there are no significant findings."
                },
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "severity": {
                        "type": "string",
                        "enum": ["P0", "P1", "P2"]
                      },
                      "path": {
                        "type": "string",
                        "description": "Repo-relative file path."
                      },
                      "line": {
                        "type": "integer",
                        "description": "1-based line number on the PR head side."
                      },
                      "explanation": {
                        "type": "string"
                      },
                      "suggestion": {
                        "type": "string",
                        "description": "Concrete simpler or corrected version."
                      }
                    },
                    "required": ["severity", "path", "line", "explanation"],
                    "additionalProperties": false
                  }
                }
              },
              "required": ["summary", "no_blocking_issues", "findings"],
              "additionalProperties": false
            }
          prompt: |
            Review ONLY the changes in this pull request.

            ## Method

            1. Read `AGENTS.md` first. It defines this repository's architecture
               and development guidelines, and it is the standard you are
               reviewing against.
            2. Inspect the full diff:
               `git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}`
            3. For every meaningful changed symbol, search the repository
               (rg / grep / read files) for existing helpers before claiming
               something is new or duplicated.
            4. Return structured findings only via the required output schema.
               Use head-side line numbers that land on changed lines whenever
               possible so they can be posted as inline PR comments.

            ## Primary focus: design and simplicity

            This is the main job. For every meaningful change, ask whether the
            same result could be achieved with less code, fewer concepts, or
            fewer moving parts, and challenge it when it could.

            Flag:
            - Anything more complex than the problem requires (KISS): clever
              code where straightforward code would do, or a solution whose
              complexity exceeds the problem it solves. If a simpler
              implementation exists, describe it concretely.
            - Speculative generality (YAGNI): configurability, flags, hooks,
              abstractions, or parameters that no current caller uses.
            - Duplicated logic (DRY): a new helper that reimplements something
              already in the codebase. Search the repository before concluding
              it is new.
            - Single-use abstractions: a class, wrapper, factory, or layer of
              indirection with exactly one caller and no clear reason to exist.
            - Code that could simply be deleted. No part is the best part.
            - Functions doing several unrelated things, or that would read more
              clearly split apart or, conversely, inlined.
            - Backwards-compatibility shims, dead branches, or defensive error
              handling for scenarios that cannot occur.
            - Missing or incorrect type hints, and unclear naming.

            When you propose a simplification, put the concrete better version
            in `suggestion`. A vague "this could be simpler" is not useful.

            ## Also flag

            - Correctness bugs
            - Security vulnerabilities
            - Data integrity risks
            - Concurrency and race conditions
            - Breaking API changes
            - Meaningful performance regressions
            - Missing tests for important behavior

            ## Ignore

            - Formatting and line length; ruff handles that
            - Naming or style preferences with no readability impact
            - Hypothetical problems without a realistic failure case
            - Code not touched by this pull request, unless the change
              duplicates it or should have reused it

            Only report high-confidence, actionable findings.
            Severity: P0 = must fix before merge, P1 = should fix, P2 = nit.
            If there are no significant issues, set `no_blocking_issues` true,
            leave `findings` empty, and summarize with
            "No blocking issues found."

  post-review:
    name: Post Codex Review
    needs: codex-review
    if: needs.codex-review.outputs.review != ''
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Post review with inline comments
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW: ${{ needs.codex-review.outputs.review }}
        with:
          github-token: ${{ github.token }}
          script: |
            const raw = process.env.CODEX_REVIEW || '';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const commit_id = context.payload.pull_request.head.sha;

            function parseReview(text) {
              const trimmed = text.trim();
              try {
                return JSON.parse(trimmed);
              } catch (_) {
                // fall through
              }

              const fenced = trimmed.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
              if (fenced) {
                return JSON.parse(fenced[1]);
              }

              const start = trimmed.indexOf('{');
              const end = trimmed.lastIndexOf('}');
              if (start !== -1 && end > start) {
                return JSON.parse(trimmed.slice(start, end + 1));
              }

              throw new Error('not json');
            }

            function formatFinding(finding) {
              const severity = finding.severity || 'P2';
              const explanation = finding.explanation || '';
              const suggestion = finding.suggestion
                ? `\n\n**Suggestion:**\n\`\`\`\n${finding.suggestion}\n\`\`\``
                : '';
              return `**${severity}** — ${explanation}${suggestion}`;
            }

            let data;
            try {
              data = parseReview(raw);
            } catch (_) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `## Codex review\n\n${raw}`,
              });
              return;
            }

            const findings = Array.isArray(data.findings) ? data.findings : [];
            const summaryParts = [
              '## Codex review',
              '',
              data.summary || 'Review complete.',
            ];

            if (data.no_blocking_issues && findings.length === 0) {
              summaryParts.push('', 'No blocking issues found.');
            } else if (findings.length > 0) {
              summaryParts.push(
                '',
                `Findings: ${findings.length}` +
                  ` (P0: ${findings.filter((f) => f.severity === 'P0').length},` +
                  ` P1: ${findings.filter((f) => f.severity === 'P1').length},` +
                  ` P2: ${findings.filter((f) => f.severity === 'P2').length})`,
              );
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              commit_id,
              event: 'COMMENT',
              body: summaryParts.join('\n'),
            });

            const failed = [];

            for (const finding of findings) {
              const body = formatFinding(finding);
              const path = finding.path;
              const line = Number(finding.line);

              if (!path || !Number.isInteger(line) || line < 1) {
                failed.push(`- ${body}`);
                continue;
              }

              try {
                await github.rest.pulls.createReviewComment({
                  owner,
                  repo,
                  pull_number,
                  commit_id,
                  path,
                  line,
                  side: 'RIGHT',
                  body,
                });
              } catch (error) {
                failed.push(
                  `- \`${path}:${line}\` — ${body}\n  _Could not attach inline._`,
                );
              }
            }

            if (failed.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: [
                  '### Findings that could not be attached inline',
                  '',
                  ...failed,
                ].join('\n'),
              });
            }
