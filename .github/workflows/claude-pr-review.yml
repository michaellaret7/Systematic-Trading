name: Claude PR Review

# Deliberately not `synchronize`. A review fires once, when the PR is ready to
# be read; pushing fixes for that review does not fire another one. With
# `synchronize` the reviewer re-read the whole base...head diff after every
# push and, being an LLM asked to find problems, always found more — so
# addressing a review produced a new review and the PR never converged.
#
# To ask for another pass after a substantial rewrite, add the `claude-review`
# label. Remove and re-add it to run again.
on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - ready_for_review
      - labeled

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude PR Review
    # The `labeled` trigger fires for every label, so gate it on ours.
    if: >-
      github.event.pull_request.draft == false
      && vars.PR_REVIEWER == 'claude'
      && (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prefetch base and head SHAs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"

      - name: Review pull request with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          track_progress: true

          prompt: |
            REPOSITORY: ${{ github.repository }}
            PULL REQUEST: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            HEAD BRANCH: ${{ github.event.pull_request.head.ref }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review the changes introduced by this pull request.

            ## Method

            1. Read `.claude/CLAUDE.md` first. It defines this repository's
               architecture and development guidelines, and it is the standard
               you are reviewing against.
            2. Inspect the full PR diff:
               `git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}`
               and/or `gh pr diff ${{ github.event.pull_request.number }}`.
            3. For every meaningful changed symbol, use Read / Grep / Glob to
               inspect surrounding code and search the repo for existing
               helpers before claiming something is new or missing.
            4. If there are findings, post them as inline comments on the
               affected lines. Always finish with one concise top-level PR
               comment, whether or not there were findings.

            ## Primary focus: design and simplicity

            This is the main job. For every meaningful change, ask whether the
            same result could be achieved with less code, fewer concepts, or
            fewer moving parts, and challenge it when it could.

            Asking the question of every change does not mean every change
            fails it. Most well-written changes survive this scrutiny intact,
            and reporting that is the correct outcome, not a lazy one.

            Flag:
            - Anything more complex than the problem requires (KISS): clever
              code where straightforward code would do, or a solution whose
              complexity exceeds the problem it solves. If a simpler
              implementation exists, describe it concretely.
            - Speculative generality (YAGNI): configurability, flags, hooks,
              abstractions, or parameters that no current caller uses.
            - Duplicated logic (DRY): a new helper that reimplements something
              already in the codebase. Search before concluding it is new.
            - Single-use abstractions: a class, wrapper, factory, or layer of
              indirection with exactly one caller and no clear reason to exist.
            - Code that could simply be deleted. No part is the best part.
            - Functions doing several unrelated things, or that would read more
              clearly split apart or, conversely, inlined.
            - Backwards-compatibility shims, dead branches, or defensive error
              handling for scenarios that cannot occur.
            - Missing or incorrect type hints, and unclear naming.

            When you propose a simplification, show the shape of the better
            version. A vague "this could be simpler" is not a useful finding.

            ## Also flag

            - Definite correctness bugs
            - Security vulnerabilities
            - Incorrect error handling
            - Race conditions or concurrency issues
            - Data loss or data corruption risks
            - Breaking API or database changes
            - Meaningful performance regressions
            - Missing tests for important behavior

            ## Do not comment on

            - Formatting or line length; ruff handles that
            - Naming or style preferences with no readability impact
            - Hypothetical problems without a realistic failure case
            - Code that was not changed by this pull request, unless the change
              duplicates it or should have reused it
            - Refactors that trade one form of complexity for another

            Only report high-confidence, actionable findings. A short review
            carrying one real simplification is better than a long one padded
            with observations, and a review carrying none is better still when
            none exist.

            ## Approving cleanly

            A pull request with nothing wrong with it is a normal and frequent
            outcome, and the review that says so is a successful review. You
            are not measured by how many findings you produce, and there is no
            expected number. Never manufacture a finding, downgrade a
            preference into a "concern", or raise something you would not
            defend if challenged, in order to have written something.

            Apply one test to every finding before you post it: would you ask
            the author to change this if it cost them an hour and a rerun of
            the test suite? If not, do not post it — not inline, not as a
            passing remark in the summary, not as a "minor note" or "nit".

            If nothing clears that bar, post no inline comments at all and make
            the top-level comment exactly:

            "Reviewed the full diff against CLAUDE.md. No changes needed."

            Do not append caveats, observations, or things you "considered
            flagging" to that sentence. An unqualified approval is the goal.

            ## Otherwise

            Add inline comments on the affected lines (pass `confirmed: true`
            to the inline-comment tool). Finish with a concise top-level
            summary of what you found.

          claude_args: |
            --model claude-opus-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*)"
