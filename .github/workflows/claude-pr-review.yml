name: Claude PR Review

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude PR Review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Review pull request with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          track_progress: true

          prompt: |
            REPOSITORY: ${{ github.repository }}
            PULL REQUEST: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            HEAD BRANCH: ${{ github.event.pull_request.head.ref }}

            Review the changes introduced by this pull request.

            Focus on:
            - Definite correctness bugs
            - Security vulnerabilities
            - Incorrect error handling
            - Race conditions or concurrency issues
            - Data loss or data corruption risks
            - Breaking API or database changes
            - Meaningful performance regressions
            - Missing tests for important behavior

            Do not comment on:
            - Minor style preferences
            - Formatting that should be handled by a linter
            - Subjective refactoring ideas
            - Hypothetical problems without a realistic failure case
            - Code that was not changed by this pull request

            Only report high-confidence, actionable findings.

            Add inline comments on the affected lines when possible.
            Finish with a concise top-level summary.

            If there are no significant findings, explicitly say:
            "No blocking issues found."

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"